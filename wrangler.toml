name = "ramaaz-kyc"
main = "src/index.ts"

# The OAuth token can see three Ramaaz accounts, so wrangler cannot pick one on
# its own and a non-interactive deploy fails. Pinned to the account that already
# hosts rdb-kyc-worker (subdomain yazan-adnof), so this Worker is a sibling of
# the existing deployment rather than landing somewhere else.
account_id = "725421c06cddc0ed4694b7cd177ae60e"
# Matches the previously-working KYC worker. The newer workerd runtime implements
# the Node APIs the AWS SDK needs (e.g. process.report) and runs the KYC image
# pipeline — the old 2024-09-23 date used the legacy unenv polyfill that threw
# "process.report.getReport is not implemented yet".
compatibility_date = "2026-03-06"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ENVIRONMENT = "development"

# ── The tenant registry ─────────────────────────────────────────────────────
# Every product this Worker serves, keyed by the `X-Ramaaz-Tenant` header (no
# header → "rdb", so existing clients are unaffected). Plaintext config, so it
# holds base URLs, cookie names and CORS origins — and NO secrets.
#
# Adding a product is ONE entry here plus two secrets. No code change:
#
#   wrangler secret put KYC_SHARED_SECRET_<ID>
#   wrangler secret put KYC_INTERNAL_SECRET_<ID>
#
# RDB keeps its existing unsuffixed KYC_SHARED_SECRET / KYC_INTERNAL_SECRET, so
# nothing about that deployment needs re-provisioning.
#
# ⚠️ Every tenant backend must speak the SAME contract — same paths, shapes and
# auth. Only the ORDER in which a product's own flow calls them may differ, and
# order lives in the backend because this Worker keeps no state between calls.
TENANTS = '''{"rdb":{"baseUrl":"https://trydos_wallet_develop.ramaaz.dev","cookies":{"access":"rdb_at","step":"rdb_step"},"origins":["https://ramaaz-digital-bank.online","https://dev.ramaaz-digital-bank.online","https://new.ramaaz-digital-bank.online","https://api.ramaaz-digital-bank.online","http://localhost:3000","https://localhost:3000"]},"root":{"baseUrl":"https://staging-backend.ramaaz.store/v1","cookies":{"access":"root_at","step":"root_challenge"},"origins":["https://canroot.yazan-adnof.workers.dev","https://ramaaz-root.yazan-adnof.workers.dev","http://localhost:3002"]}}'''
AWS_REGION = "us-east-1"
AWS_MOCK = "false"
OPENAI_TRANSLATION_MODEL = "gpt-4o-mini"
KYC_TRANSLATE_ARABIC_NAMES = "true"

# NOTE: the HeyGen / Simli avatar vars that lived here were NOT carried over.
# They configured the video-interview KYC step, whose frontend was deleted from
# rdb — the /heygen-token, /simli-* and /verify-video routes in src/routes/kyc.ts
# now have no caller. Those routes should be removed; until then they are inert.
#
# HEYGEN_API_KEY was committed here in plaintext, so it is in rdb's git history.
# ROTATE IT. Anything genuinely secret belongs in `wrangler secret`, never [vars]
# — [vars] is plaintext config that ships with the Worker and lands in git.

# Secrets — set via dashboard or:
#   wrangler secret put AWS_ACCESS_KEY_ID --env production
#   wrangler secret put AWS_SECRET_ACCESS_KEY --env production
#   wrangler secret put OPENAI_API_KEY --env production
#   wrangler secret put KYC_WEBHOOK_SECRET --env production
#   wrangler secret put KYC_INTERNAL_SECRET --env production
#   wrangler secret put KYC_SHARED_SECRET --env production

[env.production]
name = "ramaaz-kyc-production"
[env.production.vars]
ENVIRONMENT = "production"
AWS_REGION = "us-east-1"
AWS_MOCK = "false"
# Envs do not inherit the top-level [vars], so the registry is repeated.
TENANTS = '''{"rdb":{"baseUrl":"https://trydos_wallet_develop.ramaaz.dev","cookies":{"access":"rdb_at","step":"rdb_step"},"origins":["https://ramaaz-digital-bank.online","https://dev.ramaaz-digital-bank.online","https://new.ramaaz-digital-bank.online","https://api.ramaaz-digital-bank.online","http://localhost:3000","https://localhost:3000"]},"root":{"baseUrl":"https://staging-backend.ramaaz.store/v1","cookies":{"access":"root_at","step":"root_challenge"},"origins":["https://canroot.yazan-adnof.workers.dev","https://ramaaz-root.yazan-adnof.workers.dev","http://localhost:3002"]}}'''
